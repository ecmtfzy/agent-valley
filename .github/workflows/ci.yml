name: CI
on:
  push:
    branches: [main, codex-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex-python:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test Codex hook bridge and read-only runtime helper
        run: |
          python3 -m unittest discover -s integrations/codex -p 'test_*.py'
          python3 testing/test-probe-codex-runtime.py
      - name: Test Claude usage recovery helper
        run: python3 -m unittest discover -s integrations/claude -p 'test_*.py'
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build the app
        run: ./build-app.sh
